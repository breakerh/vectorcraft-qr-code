[package]
name = "vectorcraft-qr-code"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
qrcodegen = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false
